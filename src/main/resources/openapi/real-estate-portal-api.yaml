openapi: 3.0.3
info:
  title: Real Estate Portal API
  version: 0.1.0
  description: |
    CRUD API for the Real Estate Portal (RSP) data model defined in `real-estate-portal-db-ddl.sql`.

    Conventions:
    - JSON properties use camelCase and drop the table prefix of the column
      (e.g. `user_first_name` is exposed as `firstName`).
    - Identifiers are UUIDs. `id`, `createdAt` and `updatedAt` are generated by the server and read-only.
    - Updates are partial (`PATCH`): only the properties sent are changed.
    - Collections are paginated with `limit` and `offset`.
    - Errors are returned as `Error` objects.
servers:
  - url: http://localhost:8080/api/v1
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: Users
    description: Platform users (identity is managed in Keycloak).
  - name: Agencies
    description: Real estate agencies.
  - name: Agents
    description: Users that work for an agency. An agent is identified by the pair (agencyId, userId).
  - name: Properties
    description: Physical properties (address and characteristics), independent of any advertisement.
  - name: Listings
    description: Advertisements (sale or rent) of a property published by an agency.
  - name: Listing Media
    description: Photos and other media attached to a listing. (listingId, displayOrder) must be unique.
  - name: Leads
    description: Contact requests received for a listing.
  - name: Plans
    description: Subscription plans offered to agencies.
  - name: Subscriptions
    description: Plan subscriptions of agencies.
  - name: Payments
    description: Payments of subscriptions.

paths:
  /users:
    parameters:
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/XCorrelationId'
    get:
      tags: [Users]
      operationId: listUsers
      summary: List users
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/UserStatus' }
        - name: email
          in: query
          required: false
          description: Exact e-mail match.
          schema: { type: string, format: email }
      responses:
        '200':
          description: Page of users.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Users]
      operationId: createUser
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: The user was created.
          headers:
            Location:
              description: URI of the created resource.
              schema: { type: string, format: uri-reference }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/{userId}:
    parameters:
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/XCorrelationId'
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      operationId: getUser
      summary: Get a user by id
