components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token issued by Keycloak.

  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of records to return. Defaults to 20.
      schema: { type: integer, format: int32, minimum: 1, maximum: 100, default: 20 }
    Offset:
      name: offset
      in: query
      required: false
      description: Number of records to skip. Defaults to 0.
      schema: { type: integer, format: int32, minimum: 0, default: 0 }
    XRequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Identifier of this request, used for tracing.
      schema: { type: string, maxLength: 128 }
    XCorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Identifier that correlates related requests across services.
      schema: { type: string, maxLength: 128 }
    UserId:
      name: userId
      in: path
      required: true
      description: User identifier.
      schema: { type: string, format: uuid }
    AgencyId:
      name: agencyId
      in: path
      required: true
      description: Agency identifier.
      schema: { type: string, format: uuid }
    PropertyId:
      name: propertyId
      in: path
      required: true
      description: Property identifier.
      schema: { type: string, format: uuid }
    ListingId:
      name: listingId
      in: path
      required: true
      description: Listing identifier.
      schema: { type: string, format: uuid }
    MediaId:
      name: mediaId
      in: path
      required: true
      description: Listing media identifier.
      schema: { type: string, format: uuid }
    LeadId:
      name: leadId
      in: path
      required: true
      description: Lead identifier.
      schema: { type: string, format: uuid }
    PlanId:
      name: planId
      in: path
      required: true
      description: Plan identifier.
      schema: { type: string, format: uuid }
    SubscriptionId:
      name: subscriptionId
      in: path
      required: true
      description: Subscription identifier.
      schema: { type: string, format: uuid }
    PaymentId:
      name: paymentId
      in: path
      required: true
      description: Payment identifier.
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Malformed request or invalid parameters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The caller is not allowed to perform this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: The request conflicts with the current state (unique constraint or referenced records).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: The request is well-formed but violates a business or integrity rule.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: VALIDATION_ERROR }
        message: { type: string }
        requestId: { type: string }
        details:
          type: array
          items:
            type: object
            required: [issue]
            properties:
              field: { type: string }
              issue: { type: string }
    GeoPoint:
      type: object
      description: WGS 84 (SRID 4326) geographic point.
      required: [latitude, longitude]
      properties:
        latitude: { type: number, format: double, minimum: -90, maximum: 90, example: -23.2237 }
